name = "yotei-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "yotei"
database_id = "d95d8827-bdf5-4f07-b342-aecd8c87b8f5"

# 5分ごとにスプレッドシートから取り込む
[triggers]
crons = ["*/5 * * * *"]

[vars]
GAS_URL = "https://script.google.com/macros/s/AKfycbxp2eUcpIjCj0ZWyAPPD9m3egJrKdWmXRK2AVnFrmBm4iO1QHCk-FZEH5LFFv7OloqcjQ/exec"
# ★修正2（/api/syncの簡易認証）: 空のままなら認証は要求しない（移行期間中の暫定運用）。
# 有効にするときは、ここに秘密の文字列を設定し、backend.json の syncKey にも
# 同じ値を設定する（画面側はそこから読んでヘッダ X-Sync-Key に載せて送る）。
# 値は自分（利用者）が後で設定する。ここにベタ書きしない。
SYNC_KEY = ""
