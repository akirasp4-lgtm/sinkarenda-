name = "yotei-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "yotei"
database_id = "d95d8827-bdf5-4f07-b342-aecd8c87b8f5"

# 5分ごとにスプレッドシートから取り込む
[triggers]
crons = ["*/5 * * * *"]

[vars]
GAS_URL = "https://script.google.com/macros/s/AKfycbxp2eUcpIjCj0ZWyAPPD9m3egJrKdWmXRK2AVnFrmBm4iO1QHCk-FZEH5LFFv7OloqcjQ/exec"
# ★3回目レビューの裁定（4回目レビューでもwrangler.tomlのこのコメントだけ古いままと
# 指摘された。是正）: これは「認証」ではない。backend.jsonはGitHub Pagesで公開される
# ファイルであり、SYNC_KEYと同じ値をそこにも書く構造上、この鍵自体が公開情報になる。
# つまり「秘密を知っている者だけが通せる」という認証の前提が成り立たない。
# 設定しても「なりすまし防止」にはならず、「curlで鍵の値をそのまま真似れば素通りする」
# ことに変わりはない。
# 実効的な防御は cf/src/index.js の Origin検証（ブラウザ経由の悪用のみ防げる。curl等の
# 直接リクエストは防げない）と、直近1分間の同期回数を制限するレート制限（無料枠の
# 枯渇を緩和する。認証ではない）の2つである。
# 空のままなら認証ヘッダの要求もしない（移行期間中の暫定運用）。値を設定する場合も
# 「連打を減らす程度の簡易な抑止」以上の効果は期待しないこと。設定する場合は
# backend.json の syncKey にも同じ値を書く（画面側はそこから読んでヘッダ X-Sync-Key に
# 載せて送る）。値は自分（利用者）が後で設定する。ここにベタ書きしない。
SYNC_KEY = ""
